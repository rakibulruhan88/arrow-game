<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Arrow Master - 3D Room Edition (Pro)</title>
    <style>
        :root {
            --bg-color: #03050c;
            --primary-glow: #00ffcc;
            --panel-bg: rgba(10, 16, 46, 0.95);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: #fff;
            font-family: 'Poppins', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            -webkit-user-select: none;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            background: #020308;
            box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.9), inset 0 0 50px rgba(0, 255, 204, 0.1);
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* --- UI Layer --- */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 20px 30px;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .clickable {
            pointer-events: auto; 
        }

        .gear-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(0, 255, 204, 0.5);
            color: #fff;
            font-size: 24px;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.2);
        }

        .gear-btn:hover {
            background: rgba(0, 255, 204, 0.2);
            transform: rotate(90deg);
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.5);
        }

        .title {
            font-size: clamp(20px, 4vw, 36px);
            letter-spacing: 2px;
            color: #e0f7fa;
            text-transform: uppercase;
            text-shadow: 0 0 10px var(--primary-glow), 0 0 20px var(--primary-glow);
            font-weight: 700;
        }

        .score-box {
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 16px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-size: clamp(14px, 4vw, 20px);
            backdrop-filter: blur(5px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            white-space: nowrap;
        }

        .instructions {
            width: 100%;
            text-align: center;
            padding-bottom: 30px;
            font-size: clamp(14px, 4vw, 18px);
            color: #a0aec0;
            letter-spacing: 1px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }

        /* --- Modal Settings & History --- */
        .modal {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.7);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }

        .modal.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: var(--panel-bg);
            border: 2px solid var(--primary-glow);
            border-radius: 15px;
            padding: 25px;
            width: 90%;
            max-width: 450px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.3);
            position: relative;
            transform: translateY(-20px);
            transition: all 0.3s ease;
        }

        .modal.active .modal-content {
            transform: translateY(0);
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 28px;
            cursor: pointer;
            color: #ff0044;
            transition: 0.2s;
        }
        
        .close-btn:hover { color: #ff4d79; }

        .modal h2 {
            font-size: 22px;
            color: var(--primary-glow);
            border-bottom: 1px solid rgba(0, 255, 204, 0.3);
            padding-bottom: 10px;
            margin-bottom: 5px;
        }

        .setting-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 10px 15px;
            border-radius: 8px;
        }

        .setting-group select {
            background: #020308;
            color: #fff;
            border: 1px solid var(--primary-glow);
            padding: 5px 10px;
            border-radius: 5px;
            outline: none;
            cursor: pointer;
            font-family: inherit;
        }

        /* Hide Mobile View Setting on Desktop */
        @media (min-width: 769px) {
            .mobile-only {
                display: none !important;
            }
        }

        .btn {
            background: var(--primary-glow);
            color: #000;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-family: inherit;
            transition: 0.2s;
            text-align: center;
            text-transform: uppercase;
        }

        .btn:hover { background: #00cca3; box-shadow: 0 0 10px var(--primary-glow); }
        .btn-danger { background: #ff0044; color: #fff; }
        .btn-danger:hover { background: #cc0036; box-shadow: 0 0 10px #ff0044; }

        .history-container {
            flex-grow: 1;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 8px;
            padding: 10px;
            max-height: 200px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 14px;
        }
        .history-item:last-child { border-bottom: none; }
        .history-item .date { color: #a0aec0; font-size: 12px; }
        .history-item .score { font-weight: bold; color: var(--primary-glow); }

        .history-container::-webkit-scrollbar { width: 6px; }
        .history-container::-webkit-scrollbar-thumb { background: var(--primary-glow); border-radius: 10px; }

        @media (max-width: 600px) {
            .top-bar { padding: 15px; }
            .title { font-size: 18px; }
            .gear-btn { width: 35px; height: 35px; font-size: 18px; }
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    
    <div class="ui-layer">
        <div class="top-bar">
            <div class="header">
                <button id="gearBtn" class="gear-btn clickable">⚙️</button>
                <h1 class="title">🏹 ARROW MASTER</h1>
            </div>
            <div class="score-box">
                Score: <span id="scoreVal">0</span>
            </div>
        </div>
        <div class="instructions">Pull to Shoot</div>
    </div>
</div>

<!-- Settings & History Modal -->
<div id="settingsModal" class="modal clickable">
    <div class="modal-content">
        <span id="closeModal" class="close-btn">&times;</span>
        
        <h2>Game Settings</h2>
        
        <div class="setting-group mobile-only">
            <span>Mobile View:</span>
            <select id="layoutSelect">
                <option value="Horizontal">Horizontal</option>
                <option value="Vertical">Vertical</option>
            </select>
        </div>

        <div class="setting-group">
            <span>Difficulty:</span>
            <select id="diffSelect">
                <option value="Easy">Easy</option>
                <option value="Medium">Medium</option>
                <option value="Hard">Hard</option>
                <option value="Very Hard">Very Hard</option>
                <option value="Very Complex">Very Complex</option>
            </select>
        </div>
        <button id="resetGameBtn" class="btn">Reset Game & Save Score</button>

        <h2>Match History</h2>
        <div class="history-container" id="historyList">
            <!-- History items will be injected here via JS -->
        </div>
        <button id="clearHistoryBtn" class="btn btn-danger">Clear History</button>
    </div>
</div>

<script>
    const GRAVITY = 0.25;
    const PULL_POWER_MULTIPLIER = 0.45;
    
    // -- Local Storage Variables & Setup --
    let score = parseInt(localStorage.getItem('arrow_score')) || 0;
    let currentDifficulty = localStorage.getItem('arrow_difficulty') || 'Medium';
    let mobileLayout = localStorage.getItem('arrow_mobile_layout') || 'Horizontal';
    let matchHistory = JSON.parse(localStorage.getItem('arrow_history')) || [];

    const scoreEl = document.getElementById('scoreVal');
    scoreEl.innerText = score;

    // -- Difficulty Configuration --
    const difficulties = {
        'Easy': { speed: 0.015, sizeMult: 1.3, rangeMult: 0.5, erratic: false, moveX: false },
        'Medium': { speed: 0.025, sizeMult: 1.0, rangeMult: 1.0, erratic: false, moveX: false },
        'Hard': { speed: 0.04, sizeMult: 0.75, rangeMult: 1.5, erratic: false, moveX: false },
        'Very Hard': { speed: 0.06, sizeMult: 0.6, rangeMult: 2.0, erratic: true, moveX: false },
        'Very Complex': { speed: 0.08, sizeMult: 0.5, rangeMult: 2.2, erratic: true, moveX: true }
    };

    // -- DOM Elements for Modal --
    const gearBtn = document.getElementById('gearBtn');
    const modal = document.getElementById('settingsModal');
    const closeModal = document.getElementById('closeModal');
    const diffSelect = document.getElementById('diffSelect');
    const layoutSelect = document.getElementById('layoutSelect');
    const resetGameBtn = document.getElementById('resetGameBtn');
    const clearHistoryBtn = document.getElementById('clearHistoryBtn');
    const historyList = document.getElementById('historyList');

    diffSelect.value = currentDifficulty;
    layoutSelect.value = mobileLayout;

    // UI Events
    gearBtn.addEventListener('click', openModal);
    closeModal.addEventListener('click', closeMod);
    
    diffSelect.addEventListener('change', (e) => {
        currentDifficulty = e.target.value;
        localStorage.setItem('arrow_difficulty', currentDifficulty);
        if(target) target.updateResponsive();
    });

    layoutSelect.addEventListener('change', (e) => {
        mobileLayout = e.target.value;
        localStorage.setItem('arrow_mobile_layout', mobileLayout);
        resize(); // Apply immediately
    });

    resetGameBtn.addEventListener('click', () => {
        if (score > 0) {
            const date = new Date().toLocaleString();
            matchHistory.unshift({ date: date, score: score, diff: currentDifficulty });
            localStorage.setItem('arrow_history', JSON.stringify(matchHistory));
        }
        
        score = 0;
        scoreEl.innerText = score;
        localStorage.setItem('arrow_score', score);
        arrows = []; 
        
        renderHistory();
        closeMod();
    });

    clearHistoryBtn.addEventListener('click', () => {
        matchHistory = [];
        localStorage.setItem('arrow_history', JSON.stringify(matchHistory));
        renderHistory();
    });

    function openModal() {
        modal.classList.add('active');
        renderHistory();
    }
    
    function closeMod() {
        modal.classList.remove('active');
    }

    function renderHistory() {
        historyList.innerHTML = '';
        if(matchHistory.length === 0) {
            historyList.innerHTML = '<div style="text-align:center; padding: 20px; color: #666;">No history found.</div>';
            return;
        }
        matchHistory.forEach(item => {
            const div = document.createElement('div');
            div.className = 'history-item';
            div.innerHTML = `
                <div>
                    <div class="score">Score: ${item.score} <span style="font-size:11px; color:#fff; font-weight:normal;">(${item.diff})</span></div>
                    <div class="date">${item.date}</div>
                </div>
            `;
            historyList.appendChild(div);
        });
    }

    window.addEventListener('click', (e) => {
        if(e.target === modal) closeMod();
    });

    function saveScore() {
        scoreEl.innerText = score;
        localStorage.setItem('arrow_score', score);
    }

    // --- GAME ENGINE ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let width, height;
    let isVertical = false;

    function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
        
        // Detect if should run vertical layout (only on small screens)
        isVertical = (mobileLayout === 'Vertical') && (width <= 768);

        if(target) target.updateResponsive();
        if(bow) bow.updateResponsive();
    }
    window.addEventListener('resize', resize);

    let arrows = [];
    let starParticles = [];
    let target;
    let bow;
    
    let isDragging = false;
    let dragStartX = 0, dragStartY = 0;
    let dragCurrentX = 0, dragCurrentY = 0;

    function drawRoom() {
        ctx.strokeStyle = 'rgba(0, 255, 204, 0.05)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        let vanishY = isVertical ? height / 2 : height / 2 - 100;
        
        for(let i = 0; i <= width; i += 50) {
            ctx.moveTo(i, height);
            ctx.lineTo(width/2, vanishY);
        }
        for(let i = 0; i <= width; i += 50) {
            ctx.moveTo(i, 0);
            ctx.lineTo(width/2, vanishY);
        }
        ctx.stroke();

        ctx.strokeStyle = 'rgba(0, 255, 204, 0.15)';
        ctx.lineWidth = 4;
        ctx.strokeRect(0, 0, width, height);
    }

    class Target {
        constructor() {
            this.angle = 0;
            this.updateResponsive();
        }

        updateResponsive() {
            let config = difficulties[currentDifficulty];
            this.radius = Math.max(20, Math.min(60, width * 0.1)) * config.sizeMult; 
            
            if (isVertical) {
                this.baseX = width / 2;
                this.baseY = Math.max(120, height * 0.15); // Adjust for top bar
            } else {
                this.baseX = width - Math.max(50, width * 0.2); 
                this.baseY = height / 2 + 20;
            }
            
            this.x = this.baseX;
            this.y = this.baseY;
        }

        update() {
            let config = difficulties[currentDifficulty];
            this.angle += config.speed;
            
            // X and Y floating ranges based on mode
            let floatRangeX = isVertical ? (width * 0.25) * config.rangeMult : 0;
            let floatRangeY = isVertical ? 0 : Math.min(100, height * 0.2) * config.rangeMult;
            
            if(config.erratic) {
                if (isVertical) {
                    this.x = this.baseX + Math.sin(this.angle) * floatRangeX + Math.cos(this.angle * 2.3) * (floatRangeX * 0.4);
                } else {
                    this.y = this.baseY + Math.sin(this.angle) * floatRangeY + Math.cos(this.angle * 2.3) * (floatRangeY * 0.4);
                }
            } else {
                if (isVertical) this.x = this.baseX + Math.sin(this.angle) * floatRangeX;
                else this.y = this.baseY + Math.sin(this.angle) * floatRangeY;
            }

            if(config.moveX) {
                if (isVertical) this.y = this.baseY + Math.sin(this.angle * 0.8) * 40;
                else this.x = this.baseX + Math.sin(this.angle * 0.8) * 80;
            } else {
                if (isVertical) this.y = this.baseY;
                else this.x = this.baseX;
            }
        }

        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);

            ctx.shadowColor = 'rgba(0,0,0,0.8)';
            ctx.shadowBlur = 25;
            ctx.shadowOffsetY = 15;

            const redGrd = ctx.createRadialGradient(0, 0, this.radius * 0.7, 0, 0, this.radius);
            redGrd.addColorStop(0, '#ff0044');
            redGrd.addColorStop(1, '#990029');
            
            ctx.beginPath();
            ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
            ctx.fillStyle = redGrd;
            ctx.fill();

            ctx.shadowBlur = 0;
            ctx.shadowOffsetY = 0;

            ctx.beginPath();
            ctx.arc(0, 0, this.radius * 0.6, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();

            const yellowGrd = ctx.createRadialGradient(0, 0, 0, 0, 0, this.radius * 0.25);
            yellowGrd.addColorStop(0, '#ffffcc');
            yellowGrd.addColorStop(1, '#ffcc00');

            ctx.beginPath();
            ctx.arc(0, 0, this.radius * 0.25, 0, Math.PI * 2);
            ctx.fillStyle = yellowGrd;
            ctx.fill();

            ctx.restore();
        }
    }

    class Bow {
        constructor() {
            this.pullDistance = 0;
            this.angle = 0;
            this.updateResponsive();
        }

        updateResponsive() {
            if (isVertical) {
                this.x = width / 2;
                this.y = height - Math.max(60, height * 0.15);
                this.height = Math.max(80, Math.min(120, width * 0.3));
                this.maxPull = Math.min(100, height * 0.25); 
                if(!isDragging) this.angle = -Math.PI / 2; // Point UP
            } else {
                this.x = Math.max(50, width * 0.15); 
                this.y = height / 2;
                this.height = Math.max(80, Math.min(120, height * 0.2));
                this.maxPull = Math.min(100, width * 0.25); 
                if(!isDragging) this.angle = 0; // Point RIGHT
            }
        }

        update() {
            // Static position, only updates on resize
        }

        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.angle);

            ctx.shadowColor = '#00ffcc';
            ctx.shadowBlur = 15;

            ctx.beginPath();
            ctx.moveTo(0, -this.height / 2);
            ctx.quadraticCurveTo(this.pullDistance * 0.5 + 20, 0, 0, this.height / 2);
            ctx.strokeStyle = '#00ffcc';
            ctx.lineWidth = 6;
            ctx.lineCap = 'round';
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(0, -this.height / 2);
            ctx.quadraticCurveTo(this.pullDistance * 0.5 + 18, 0, 0, this.height / 2);
            ctx.strokeStyle = '#006652';
            ctx.lineWidth = 3;
            ctx.stroke();

            ctx.shadowBlur = 0;
            ctx.beginPath();
            ctx.moveTo(0, -this.height / 2);
            ctx.lineTo(-this.pullDistance, 0);
            ctx.lineTo(0, this.height / 2);
            ctx.strokeStyle = 'rgba(255,255,255,0.6)';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.restore();
        }
    }

    class Arrow {
        constructor(x, y, vx, vy) {
            this.x = x;
            this.y = y;
            this.vx = vx;
            this.vy = vy;
            this.length = Math.max(40, Math.min(60, width * 0.1));
            this.angle = Math.atan2(vy, vx);
            this.isFlying = true;
            this.stuckTarget = false;
            this.stuckWall = false;
            this.offsetX = 0;
            this.offsetY = 0;
        }

        update() {
            if (this.isFlying) {
                this.vy += GRAVITY;
                this.x += this.vx;
                this.y += this.vy;
                this.angle = Math.atan2(this.vy, this.vx);

                const dx = this.x + Math.cos(this.angle) * this.length / 2 - target.x;
                const dy = this.y + Math.sin(this.angle) * this.length / 2 - target.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < target.radius) {
                    this.isFlying = false;
                    this.stuckTarget = true;
                    this.offsetX = this.x - target.x;
                    this.offsetY = this.y - target.y;
                    
                    if (dist < target.radius * 0.25) {
                        score += 50; 
                        createStarExplosion(this.x, this.y, '#ffcc00');
                    } else if (dist < target.radius * 0.6) {
                        score += 20; 
                        createStarExplosion(this.x, this.y, '#ffffff');
                    } else {
                        score += 10; 
                        createStarExplosion(this.x, this.y, '#ff0044');
                    }
                    saveScore();
                    return; 
                }

                let tipX = this.x + Math.cos(this.angle) * this.length / 2;
                let tipY = this.y + Math.sin(this.angle) * this.length / 2;

                if (tipY >= height) { 
                    this.y -= (tipY - height);
                    this.isFlying = false;
                    this.stuckWall = true;
                } else if (tipY <= 0) { 
                    this.y -= tipY;
                    this.isFlying = false;
                    this.stuckWall = true;
                } else if (tipX >= width) { 
                    this.x -= (tipX - width);
                    this.isFlying = false;
                    this.stuckWall = true;
                } else if (tipX <= 0) { 
                    this.x -= tipX;
                    this.isFlying = false;
                    this.stuckWall = true;
                }

            } else if (this.stuckTarget) {
                this.x = target.x + this.offsetX;
                this.y = target.y + this.offsetY;
            }
        }

        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.angle);

            const shaftGrd = ctx.createLinearGradient(0, -2, 0, 2);
            shaftGrd.addColorStop(0, '#ffffff');
            shaftGrd.addColorStop(0.5, '#666666');
            shaftGrd.addColorStop(1, '#ffffff');
            
            ctx.beginPath();
            ctx.moveTo(-this.length / 2, 0);
            ctx.lineTo(this.length / 2, 0);
            ctx.strokeStyle = shaftGrd;
            ctx.lineWidth = 3;
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(this.length / 2, 0);
            ctx.lineTo(this.length / 2 - 10, -6);
            ctx.lineTo(this.length / 2 - 10, 6);
            ctx.closePath();
            ctx.fillStyle = '#a0aec0';
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(-this.length / 2, 0);
            ctx.lineTo(-this.length / 2 - 12, -6);
            ctx.lineTo(-this.length / 2 - 8, 0);
            ctx.lineTo(-this.length / 2 - 12, 6);
            ctx.closePath();
            ctx.fillStyle = '#00ffcc';
            ctx.fill();

            ctx.restore();
        }
    }

    class StarParticle {
        constructor(x, y, color) {
            this.x = x;
            this.y = y;
            let angle = Math.random() * Math.PI * 2;
            let speed = Math.random() * 6 + 3;
            this.vx = Math.cos(angle) * speed;
            this.vy = Math.sin(angle) * speed;
            this.color = color;
            this.life = 1.0;
            this.decay = Math.random() * 0.02 + 0.015;
            this.rotation = Math.random() * Math.PI;
            this.rotSpeed = (Math.random() - 0.5) * 0.3;
            this.size = Math.random() * 5 + 3; 
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.vy += 0.2; 
            this.rotation += this.rotSpeed;
            this.life -= this.decay;
        }

        draw() {
            if(this.life <= 0) return;
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.rotation);
            ctx.globalAlpha = Math.max(0, this.life);
            
            let spikes = 5;
            let outerRadius = this.size;
            let innerRadius = this.size / 2;
            let rot = Math.PI / 2 * 3;
            let x = 0, y = 0;
            let step = Math.PI / spikes;

            ctx.beginPath();
            ctx.moveTo(0, -outerRadius);
            for (let i = 0; i < spikes; i++) {
                x = Math.cos(rot) * outerRadius;
                y = Math.sin(rot) * outerRadius;
                ctx.lineTo(x, y);
                rot += step;
                x = Math.cos(rot) * innerRadius;
                y = Math.sin(rot) * innerRadius;
                ctx.lineTo(x, y);
                rot += step;
            }
            ctx.lineTo(0, -outerRadius);
            ctx.closePath();
            
            ctx.fillStyle = this.color;
            ctx.shadowColor = this.color;
            ctx.shadowBlur = 10;
            ctx.fill();
            
            ctx.restore();
        }
    }

    function createStarExplosion(x, y, color) {
        for (let i = 0; i < 20; i++) {
            starParticles.push(new StarParticle(x, y, color));
        }
    }

    function drawTrajectory() {
        if (!isDragging || bow.pullDistance <= 10) return;

        const power = bow.pullDistance * PULL_POWER_MULTIPLIER;
        const vx = Math.cos(bow.angle) * power;
        const vy = Math.sin(bow.angle) * power;
        
        let tx = bow.x - Math.cos(bow.angle) * bow.pullDistance;
        let ty = bow.y - Math.sin(bow.angle) * bow.pullDistance;
        let tvx = vx;
        let tvy = vy;

        ctx.beginPath();
        ctx.moveTo(tx, ty);
        
        for (let i = 0; i < 30; i++) {
            tvy += GRAVITY;
            tx += tvx;
            ty += tvy;
            ctx.lineTo(tx, ty);
        }

        ctx.strokeStyle = 'rgba(0, 255, 255, 0.5)';
        ctx.lineWidth = 2;
        ctx.setLineDash([8, 12]);
        ctx.stroke();
        ctx.setLineDash([]);
    }

    // -- Event Handlers --
    function handleStart(e) {
        if(modal.classList.contains('active') || e.target.closest('.clickable')) return;
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        isDragging = true;
        dragStartX = clientX;
        dragStartY = clientY;
        dragCurrentX = clientX;
        dragCurrentY = clientY;
    }

    function handleMove(e) {
        if (!isDragging) return;
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        dragCurrentX = clientX;
        dragCurrentY = clientY;

        const dx = dragStartX - dragCurrentX;
        const dy = dragStartY - dragCurrentY;
        
        bow.angle = Math.atan2(dy, dx);
        bow.pullDistance = Math.min(bow.maxPull, Math.sqrt(dx*dx + dy*dy));
    }

    function handleEnd() {
        if (!isDragging) return;
        isDragging = false;
        
        if (bow.pullDistance > 10) {
            const power = bow.pullDistance * PULL_POWER_MULTIPLIER;
            const vx = Math.cos(bow.angle) * power;
            const vy = Math.sin(bow.angle) * power;
            
            const startX = bow.x - Math.cos(bow.angle) * bow.pullDistance;
            const startY = bow.y - Math.sin(bow.angle) * bow.pullDistance;

            arrows.push(new Arrow(startX, startY, vx, vy));
        }
        
        bow.pullDistance = 0;
        bow.angle = isVertical ? -Math.PI / 2 : 0; // Reset angle
    }

    // Initialize Objects
    resize(); 
    target = new Target();
    bow = new Bow();

    canvas.addEventListener('mousedown', handleStart);
    window.addEventListener('mousemove', handleMove); 
    window.addEventListener('mouseup', handleEnd);

    canvas.addEventListener('touchstart', handleStart, {passive: false});
    window.addEventListener('touchmove', handleMove, {passive: false});
    window.addEventListener('touchend', handleEnd);

    function animate() {
        ctx.clearRect(0, 0, width, height);

        drawRoom();

        target.update();
        target.draw();
        
        bow.update();
        if (isDragging) drawTrajectory();

        if (isDragging && bow.pullDistance > 10) {
            ctx.save();
            const ax = bow.x - Math.cos(bow.angle) * bow.pullDistance;
            const ay = bow.y - Math.sin(bow.angle) * bow.pullDistance;
            ctx.translate(ax, ay);
            ctx.rotate(bow.angle);
            
            let arrLen = Math.max(40, Math.min(60, width * 0.1)) * 0.8;
            
            ctx.beginPath();
            ctx.moveTo(-arrLen/2, 0); ctx.lineTo(arrLen/2, 0);
            ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 3; ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(arrLen/2, 0); ctx.lineTo(arrLen/2 - 8, -4); ctx.lineTo(arrLen/2 - 8, 4);
            ctx.fillStyle = 'rgba(160, 174, 192, 0.4)'; ctx.fill();
            ctx.restore();
        }

        bow.draw();

        let activeArrows = [];
        let stuckArrowsCount = 0;
        
        for (let i = 0; i < arrows.length; i++) {
            arrows[i].update();
            arrows[i].draw();
            
            if (arrows[i].stuckWall || arrows[i].stuckTarget) {
                stuckArrowsCount++;
            }
            activeArrows.push(arrows[i]);
        }
        
        if (stuckArrowsCount > 15) {
            for (let i = 0; i < activeArrows.length; i++) {
                if (activeArrows[i].stuckWall || activeArrows[i].stuckTarget) {
                    activeArrows.splice(i, 1);
                    break; 
                }
            }
        }
        arrows = activeArrows;

        for (let i = starParticles.length - 1; i >= 0; i--) {
            starParticles[i].update();
            starParticles[i].draw();
            if (starParticles[i].life <= 0) {
                starParticles.splice(i, 1);
            }
        }

        requestAnimationFrame(animate);
    }

    animate();
</script>
</body>
