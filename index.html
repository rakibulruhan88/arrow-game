<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Arrow Master - 3D Mobile First</title>
    <style>
        /* CSS 3D perspective to enable 3D effects on HTML elements */
        :root {
            --bg-color: #03050c;
            --primary-glow: #00ffcc;
            --target-red: #ff0044;
            --target-white: #ffffff;
            --target-yellow: #ffcc00;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent; /* Disable tap highlight on mobile */
        }

        body {
            background-color: var(--bg-color);
            color: #fff;
            font-family: 'Poppins', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            -webkit-user-select: none;
            perspective: 1000px; /* Enable CSS 3D perspective */
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #0a102e 0%, #03050c 100%);
        }

        /* The canvas itself doesn't need 3D CSS transforms for the game logic */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            /* Optional: subtle tilt to enhance 3D feel */
            /* transform: rotateX(10deg); */
        }

        /* 3D background grid pattern using CSS */
        #game-container::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(0, 255, 204, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 204, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
            transform-origin: center;
            transform: rotateX(60deg) translateY(100px); /* Isometric ground feel */
            z-index: 0;
            opacity: 0.5;
        }

        /* UI Layer - 3D CSS Effects */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        .header {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            transform-style: preserve-3d;
            transform: translateZ(50px); /* Make title float forward in 3D */
        }

        .title {
            font-size: clamp(24px, 5vw, 36px); /* Responsive font size */
            letter-spacing: 2px;
            color: #e0f7fa;
            text-transform: uppercase;
            text-shadow: 0 0 10px var(--primary-glow), 0 0 20px var(--primary-glow);
            font-weight: 700;
        }

        .score-box {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 16px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-size: clamp(16px, 3vw, 20px);
            backdrop-filter: blur(5px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            pointer-events: auto; /* Allow interaction if needed */
        }

        .instructions {
            width: 100%;
            text-align: center;
            font-size: clamp(14px, 3vw, 18px);
            color: #a0aec0;
            letter-spacing: 1px;
            animation: pulse 2s infinite;
            transform: translateZ(30px);
        }

        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }

        /* Particle effects using CSS animations for 3D depth on success */
        .hit-particle {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: var(--primary-glow);
            border-radius: 50%;
            pointer-events: none;
            z-index: 3;
            animation: hitSparkle 0.8s ease-out forwards;
        }

        @keyframes hitSparkle {
            0% { transform: scale(1) translateZ(50px); opacity: 1; }
            100% { transform: scale(0) translateZ(150px) translate(calc((Math.random() - 0.5) * 100px), calc((Math.random() - 0.5) * 100px)); opacity: 0; }
        }

    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    
    <div class="ui-layer">
        <div class="header">
            <h1 class="title">ARROW MASTER 3D</h1>
        </div>
        <div class="score-box">
            Score: <span id="scoreVal">0</span>
        </div>
        <div class="instructions">Touch & Drag to Shoot</div>
    </div>
</div>

<script>
    // Constants
    const GRAVITY = 0.25;
    const MAX_PULL_DISTANCE = 100;
    const PULL_POWER_MULTIPLIER = 0.4;
    const TARGET_BASE_RADIUS = 60;
    const ARROW_LENGTH = 60;

    // Canvas Setup
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let width, height;

    function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Game Variables
    let score = 0;
    const scoreEl = document.getElementById('scoreVal');
    let arrows = [];
    let particles = [];
    let target;
    let bow;
    
    // Input Handling Variables
    let isDragging = false;
    let dragStartX = 0;
    let dragStartY = 0;
    let dragCurrentX = 0;
    let dragCurrentY = 0;

    // --- Core Game Classes ---

    // 3D-styled Floating Target
    class Target {
        constructor() {
            this.radius = TARGET_BASE_RADIUS;
            this.x = width - 150;
            this.y = height / 2;
            this.baseY = height / 2;
            this.angle = 0;
        }

        update() {
            // Floating animation: moves the target up and down gently
            this.angle += 0.02;
            this.y = this.baseY + Math.sin(this.angle) * 100;
            // Ensure position is correct after a resize
            this.x = width - 150; 
            this.baseY = height / 2;
        }

        draw() {
            // Drawing from an isometric perspective gives a 3D feel
            ctx.save();
            ctx.translate(this.x, this.y);
            // Rotate target slightly in isometric 3D space
            // ctx.rotate(Math.PI / 8); 

            // High-depth shadow for 3D look
            ctx.shadowColor = 'rgba(0,0,0,0.5)';
            ctx.shadowBlur = 40;
            ctx.shadowOffsetY = 20;

            // Outer Red Ring (with gradient for depth)
            const redGrd = ctx.createRadialGradient(0, 0, this.radius * 0.7, 0, 0, this.radius);
            redGrd.addColorStop(0, '#ff0044');
            redGrd.addColorStop(1, '#990029');
            
            ctx.beginPath();
            ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
            ctx.fillStyle = redGrd;
            ctx.fill();

            // Reset shadow for inner rings
            ctx.shadowBlur = 0;
            ctx.shadowOffsetY = 0;

            // Middle White Ring
            ctx.beginPath();
            ctx.arc(0, 0, this.radius * 0.6, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();

            // Inner Yellow Ring (Bullseye, with bright gradient)
            const yellowGrd = ctx.createRadialGradient(0, 0, 0, 0, 0, this.radius * 0.25);
            yellowGrd.addColorStop(0, '#ffffcc');
            yellowGrd.addColorStop(1, '#ffcc00');

            ctx.beginPath();
            ctx.arc(0, 0, this.radius * 0.25, 0, Math.PI * 2);
            ctx.fillStyle = yellowGrd;
            ctx.fill();

            ctx.restore();
        }
    }

    // 3D-styled Bow and String
    class Bow {
        constructor() {
            this.x = 150;
            this.y = height / 2;
            this.height = 120;
            this.pullDistance = 0;
            this.angle = 0;
        }

        update() {
            this.y = height / 2; // Center horizontally
        }

        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.angle);

            // Bow Glow
            ctx.shadowColor = '#00ffcc';
            ctx.shadowBlur = 15;

            // Bow arc (multiple paths to build 3D depth)
            ctx.beginPath();
            ctx.moveTo(0, -this.height / 2);
            ctx.quadraticCurveTo(this.pullDistance * 0.5 + 20, 0, 0, this.height / 2);
            ctx.strokeStyle = '#00ffcc'; // Main glow color
            ctx.lineWidth = 6;
            ctx.lineCap = 'round';
            ctx.stroke();

            // A second darker inner line to add structure and depth
            ctx.beginPath();
            ctx.moveTo(0, -this.height / 2);
            ctx.quadraticCurveTo(this.pullDistance * 0.5 + 18, 0, 0, this.height / 2);
            ctx.strokeStyle = '#006652'; // Deeper cyan
            ctx.lineWidth = 3;
            ctx.stroke();

            // Bow string (reacts to pullDistance)
            ctx.shadowBlur = 0;
            ctx.beginPath();
            ctx.moveTo(0, -this.height / 2);
            ctx.lineTo(-this.pullDistance, 0);
            ctx.lineTo(0, this.height / 2);
            ctx.strokeStyle = 'rgba(255,255,255,0.6)';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.restore();
        }
    }

    // 3D-vector-styled Arrow
    class Arrow {
        constructor(x, y, vx, vy) {
            this.x = x;
            this.y = y;
            this.vx = vx;
            this.vy = vy;
            this.length = ARROW_LENGTH;
            this.angle = Math.atan2(vy, vx);
            this.isFlying = true;
            this.stuckTarget = false;
            this.stuckGround = false;
            this.offsetX = 0;
            this.offsetY = 0;
            this.life = 1; // Used for potential fading
        }

        update() {
            if (this.isFlying) {
                // Apply physics
                this.vy += GRAVITY;
                this.x += this.vx;
                this.y += this.vy;
                this.angle = Math.atan2(this.vy, this.vx); // Turn to face the direction of travel

                // --- 3D Collision with Target ---
                // We use an simplified perspective collision check
                const dx = this.x + Math.cos(this.angle) * this.length / 2 - target.x;
                const dy = this.y + Math.sin(this.angle) * this.length / 2 - target.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < target.radius) {
                    this.isFlying = false;
                    this.stuckTarget = true;
                    // Position the arrow stuck in 3D perspective
                    this.offsetX = this.x - target.x;
                    this.offsetY = this.y - target.y;
                    
                    // --- Scoring & Particles based on depth rungs ---
                    if (dist < target.radius * 0.25) {
                        score += 50; // Bullseye (inner yellow)
                        createHitEffect(this.x, this.y, '#ffcc00');
                    } else if (dist < target.radius * 0.6) {
                        score += 20; // Middle white
                        createHitEffect(this.x, this.y, '#ffffff');
                    } else {
                        score += 10; // Outer red
                        createHitEffect(this.x, this.y, '#ff0044');
                    }
                    scoreEl.innerText = score;
                }

                // --- 3D Ground Collision (Miss) ---
                // We check if it goes below a certain "deep ground level"
                if (this.y > height - 30) {
                    this.isFlying = false;
                    this.stuckGround = true;
                }
            } else if (this.stuckTarget) {
                // Stick to the floating target perfectly
                this.x = target.x + this.offsetX;
                this.y = target.y + this.offsetY;
            }
        }

        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.angle);
            // Perspective scaling might be too complex for a single file, so we skip it

            // Main Arrow Shaft (with gradient for structure)
            const shaftGrd = ctx.createLinearGradient(0, -3, 0, 3);
            shaftGrd.addColorStop(0, '#ffffff'); // Light top
            shaftGrd.addColorStop(0.5, '#666666'); // Darker middle
            shaftGrd.addColorStop(1, '#ffffff'); // Light bottom
            
            ctx.beginPath();
            ctx.moveTo(-this.length / 2, 0);
            ctx.lineTo(this.length / 2, 0);
            ctx.strokeStyle = shaftGrd;
            ctx.lineWidth = 4;
            ctx.stroke();

            // Arrow Head (3D polyhedron look)
            ctx.beginPath();
            ctx.moveTo(this.length / 2, 0);
            ctx.lineTo(this.length / 2 - 12, -7);
            ctx.lineTo(this.length / 2 - 12, 7);
            ctx.closePath();
            
            ctx.fillStyle = '#a0aec0'; // Matte metal finish
            ctx.fill();

            // A second overlapping arrowhead shape for structure
            ctx.beginPath();
            ctx.moveTo(this.length / 2 - 12, 0);
            ctx.lineTo(this.length / 2 - 2, -1);
            ctx.lineTo(this.length / 2 - 2, 1);
            ctx.fillStyle = '#4a5568'; // Daker inner metal
            ctx.fill();

            // Arrow Fletching (Feathers, using multiple gradient layers)
            ctx.beginPath();
            ctx.moveTo(-this.length / 2, 0);
            ctx.lineTo(-this.length / 2 - 15, -7);
            ctx.lineTo(-this.length / 2 - 10, 0);
            ctx.lineTo(-this.length / 2 - 15, 7);
            ctx.closePath();
            
            ctx.fillStyle = '#00ffcc'; // Bright neon fletching
            ctx.fill();

            ctx.restore();
        }
    }

    // Advanced 3D Particle effect using HTML elements and CSS animation
    function createHitEffect(x, y, color) {
        for (let i = 0; i < 20; i++) {
            const particle = document.createElement('div');
            particle.classList.add('hit-particle');
            
            // Randomize trajectory within 3D space
            const angle = Math.random() * Math.PI * 2;
            const distance = Math.random() * 80 + 20;
            const dx = Math.cos(angle) * distance;
            const dy = Math.sin(angle) * distance;
            const dz = Math.random() * 100 + 50; // Random depth (float forward in 3D)

            particle.style.backgroundColor = color;
            particle.style.left = `${x}px`;
            particle.style.top = `${y}px`;
            
            // Set animation travel using custom CSS property values
            particle.style.setProperty('--dx', `${dx}px`);
            particle.style.setProperty('--dy', `${dy}px`);
            particle.style.setProperty('--dz', `${dz}px`);

            document.getElementById('game-container').appendChild(particle);

            // Remove particle after animation
            setTimeout(() => particle.remove(), 1000);
        }
    }

    // --- Trajectory Preview Logic ---
    function drawTrajectory() {
        if (!isDragging || bow.pullDistance <= 10) return;

        // Simulate a physical flight path for advanced pre-visualization
        const power = bow.pullDistance * PULL_POWER_MULTIPLIER;
        const vx = Math.cos(bow.angle) * power;
        const vy = Math.sin(bow.angle) * power;
        
        let tx = bow.x - Math.cos(bow.angle) * bow.pullDistance;
        let ty = bow.y - Math.sin(bow.angle) * bow.pullDistance;
        let tvx = vx;
        let tvy = vy;

        ctx.beginPath();
        ctx.moveTo(tx, ty);
        
        // Simuate for 40 dynamic steps
        for (let i = 0; i < 40; i++) {
            tvy += GRAVITY;
            tx += tvx;
            ty += tvy;
            ctx.lineTo(tx, ty);
        }

        ctx.strokeStyle = 'rgba(0, 255, 255, 0.5)';
        ctx.lineWidth = 2;
        ctx.setLineDash([10, 15]); // Strong dashed line for 'trajectory' feel
        ctx.stroke();
        ctx.setLineDash([]); // Reset immediately
    }

    // --- Input Handling (Mobile & Desktop) ---

    function handleStart(e) {
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        isDragging = true;
        dragStartX = clientX;
        dragStartY = clientY;
        dragCurrentX = clientX;
        dragCurrentY = clientY;
    }

    function handleMove(e) {
        if (!isDragging) return;
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        dragCurrentX = clientX;
        dragCurrentY = clientY;

        // Calculate bow angle and tension
        const dx = dragStartX - dragCurrentX;
        const dy = dragStartY - dragCurrentY;
        
        bow.angle = Math.atan2(dy, dx);
        bow.pullDistance = Math.min(MAX_PULL_DISTANCE, Math.sqrt(dx*dx + dy*dy));
    }

    function handleEnd() {
        if (!isDragging) return;
        isDragging = false;
        
        // Shoot arrow if pull is strong enough
        if (bow.pullDistance > 10) {
            const power = bow.pullDistance * PULL_POWER_MULTIPLIER;
            const vx = Math.cos(bow.angle) * power;
            const vy = Math.sin(bow.angle) * power;
            
            // Set starting point to where the bow string is pulled to
            const startX = bow.x - Math.cos(bow.angle) * bow.pullDistance;
            const startY = bow.y - Math.sin(bow.angle) * bow.pullDistance;

            arrows.push(new Arrow(startX, startY, vx, vy));
        }
        
        // Reset bow immediately
        bow.pullDistance = 0;
        bow.angle = 0;
    }

    // --- Main Game Cycle ---

    // Initialize core objects
    target = new Target();
    bow = new Bow();

    // Event Listeners for Input
    canvas.addEventListener('mousedown', handleStart);
    canvas.addEventListener('mousemove', handleMove);
    window.addEventListener('mouseup', handleEnd);

    canvas.addEventListener('touchstart', handleStart);
    canvas.addEventListener('touchmove', handleMove);
    window.addEventListener('touchend', handleEnd);

    // Dynamic Game Loop
    function animate() {
        ctx.clearRect(0, 0, width, height); // Clear whole canvas per frame

        // Manage Target
        target.update();
        target.draw();

        // Manage Bow
        bow.update();
        
        // Draw Trajectory preview (if dragging)
        if (isDragging) {
            drawTrajectory();
        }

        // --- Render a placeholder arrow inside the bow while dragging ---
        if (isDragging && bow.pullDistance > 10) {
            ctx.save();
            // Arrow position follows pulled bowstring
            const ax = bow.x - Math.cos(bow.angle) * bow.pullDistance;
            const ay = bow.y - Math.sin(bow.angle) * bow.pullDistance;
            ctx.translate(ax, ay);
            ctx.rotate(bow.angle);
            
            // Draw a slightly reduced, dimmer placeholder arrow
            ctx.beginPath();
            ctx.moveTo(-ARROW_LENGTH/2 * 0.8, 0); ctx.lineTo(ARROW_LENGTH/2 * 0.8, 0);
            ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 3; ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(ARROW_LENGTH/2 * 0.8, 0); ctx.lineTo(ARROW_LENGTH/2 * 0.8 - 10, -5); ctx.lineTo(ARROW_LENGTH/2 * 0.8 - 10, 5);
            ctx.fillStyle = 'rgba(160, 174, 192, 0.4)'; ctx.fill();
            ctx.beginPath();
            ctx.moveTo(-ARROW_LENGTH/2 * 0.8, 0); ctx.lineTo(-ARROW_LENGTH/2 * 0.8 - 10, -5); ctx.lineTo(-ARROW_LENGTH/2 * 0.8 - 5, 0); ctx.lineTo(-ARROW_LENGTH/2 * 0.8 - 10, 5);
            ctx.fillStyle = 'rgba(0, 255, 204, 0.4)'; ctx.fill();
            ctx.restore();
        }

        bow.draw(); // Draw final bow state on top

        // --- Manage all spawned Arrows ---
        for (let i = arrows.length - 1; i >= 0; i--) {
            arrows[i].update();
            arrows[i].draw();
            
            // Remove arrows that go too far off screen or stay too long stuck to ground
            if (arrows[i].x > width + 200 || arrows[i].x < -200 || (arrows[i].stuckGround && Math.random() < 0.05)) {
                arrows.splice(i, 1);
            }
        }

        // Continue loop
        requestAnimationFrame(animate);
    }

    // --- Start Loop ---
    animate();

</script>
</body>
</html>
