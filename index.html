<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Arrow Master - 3D Room Edition</title>
    <style>
        :root {
            --bg-color: #03050c;
            --primary-glow: #00ffcc;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: #fff;
            font-family: 'Poppins', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            -webkit-user-select: none;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            background: #020308;
            /* Inset shadow to give a deep room feel */
            box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.9), inset 0 0 50px rgba(0, 255, 204, 0.1);
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* --- UI Layer --- */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 20px 30px;
        }

        .header {
            display: flex;
            align-items: center;
        }

        .title {
            font-size: clamp(20px, 5vw, 36px);
            letter-spacing: 2px;
            color: #e0f7fa;
            text-transform: uppercase;
            text-shadow: 0 0 10px var(--primary-glow), 0 0 20px var(--primary-glow);
            font-weight: 700;
        }

        .score-box {
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 16px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-size: clamp(14px, 4vw, 20px);
            backdrop-filter: blur(5px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            white-space: nowrap;
        }

        .instructions {
            width: 100%;
            text-align: center;
            padding-bottom: 30px;
            font-size: clamp(14px, 4vw, 18px);
            color: #a0aec0;
            letter-spacing: 1px;
            animation: pulse 2s infinite;
        }

        @media (max-width: 600px) {
            .top-bar {
                flex-direction: column;
                gap: 15px;
                padding: 15px 10px;
            }
        }

        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    
    <div class="ui-layer">
        <div class="top-bar">
            <div class="header">
                <h1 class="title">🏹 ARROW MASTER</h1>
            </div>
            <div class="score-box">
                Score: <span id="scoreVal">0</span>
            </div>
        </div>
        <div class="instructions">Touch & Drag to Shoot</div>
    </div>
</div>

<script>
    const GRAVITY = 0.25;
    const PULL_POWER_MULTIPLIER = 0.45;
    const WALL_THICKNESS = 15; // The point where arrows stick to the screen edges
    
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let width, height;

    function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
        
        if(target) target.updateResponsive();
        if(bow) bow.updateResponsive();
    }
    window.addEventListener('resize', resize);

    let score = 0;
    const scoreEl = document.getElementById('scoreVal');
    let arrows = [];
    let starParticles = [];
    let target;
    let bow;
    
    let isDragging = false;
    let dragStartX = 0, dragStartY = 0;
    let dragCurrentX = 0, dragCurrentY = 0;

    // --- Draw the 3D Room Environment ---
    function drawRoom() {
        // Floor perspective lines
        ctx.strokeStyle = 'rgba(0, 255, 204, 0.05)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        for(let i = 0; i <= width; i += 50) {
            ctx.moveTo(i, height);
            ctx.lineTo(width/2, height/2 - 100);
        }
        // Ceiling perspective lines
        for(let i = 0; i <= width; i += 50) {
            ctx.moveTo(i, 0);
            ctx.lineTo(width/2, height/2 - 100);
        }
        ctx.stroke();

        // Neon borders around the room
        ctx.strokeStyle = 'rgba(0, 255, 204, 0.15)';
        ctx.lineWidth = 4;
        ctx.strokeRect(0, 0, width, height);
    }

    class Target {
        constructor() {
            this.angle = 0;
            this.updateResponsive();
        }

        updateResponsive() {
            this.radius = Math.max(30, Math.min(60, width * 0.1)); 
            this.x = width - Math.max(50, width * 0.2); 
            this.baseY = height / 2 + 20;
            this.y = this.baseY;
        }

        update() {
            this.angle += 0.02;
            let floatRange = Math.min(100, height * 0.2);
            this.y = this.baseY + Math.sin(this.angle) * floatRange;
        }

        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);

            ctx.shadowColor = 'rgba(0,0,0,0.8)';
            ctx.shadowBlur = 25;
            ctx.shadowOffsetY = 15;

            const redGrd = ctx.createRadialGradient(0, 0, this.radius * 0.7, 0, 0, this.radius);
            redGrd.addColorStop(0, '#ff0044');
            redGrd.addColorStop(1, '#990029');
            
            ctx.beginPath();
            ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
            ctx.fillStyle = redGrd;
            ctx.fill();

            ctx.shadowBlur = 0;
            ctx.shadowOffsetY = 0;

            ctx.beginPath();
            ctx.arc(0, 0, this.radius * 0.6, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();

            const yellowGrd = ctx.createRadialGradient(0, 0, 0, 0, 0, this.radius * 0.25);
            yellowGrd.addColorStop(0, '#ffffcc');
            yellowGrd.addColorStop(1, '#ffcc00');

            ctx.beginPath();
            ctx.arc(0, 0, this.radius * 0.25, 0, Math.PI * 2);
            ctx.fillStyle = yellowGrd;
            ctx.fill();

            ctx.restore();
        }
    }

    class Bow {
        constructor() {
            this.pullDistance = 0;
            this.angle = 0;
            this.updateResponsive();
        }

        updateResponsive() {
            this.x = Math.max(50, width * 0.15); 
            this.height = Math.max(80, Math.min(120, height * 0.2));
            this.y = height / 2;
            this.maxPull = Math.min(100, width * 0.25); 
        }

        update() {
            this.y = height / 2;
        }

        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.angle);

            ctx.shadowColor = '#00ffcc';
            ctx.shadowBlur = 15;

            ctx.beginPath();
            ctx.moveTo(0, -this.height / 2);
            ctx.quadraticCurveTo(this.pullDistance * 0.5 + 20, 0, 0, this.height / 2);
            ctx.strokeStyle = '#00ffcc';
            ctx.lineWidth = 6;
            ctx.lineCap = 'round';
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(0, -this.height / 2);
            ctx.quadraticCurveTo(this.pullDistance * 0.5 + 18, 0, 0, this.height / 2);
            ctx.strokeStyle = '#006652';
            ctx.lineWidth = 3;
            ctx.stroke();

            ctx.shadowBlur = 0;
            ctx.beginPath();
            ctx.moveTo(0, -this.height / 2);
            ctx.lineTo(-this.pullDistance, 0);
            ctx.lineTo(0, this.height / 2);
            ctx.strokeStyle = 'rgba(255,255,255,0.6)';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.restore();
        }
    }

    class Arrow {
        constructor(x, y, vx, vy) {
            this.x = x;
            this.y = y;
            this.vx = vx;
            this.vy = vy;
            this.length = Math.max(40, Math.min(60, width * 0.1));
            this.angle = Math.atan2(vy, vx);
            this.isFlying = true;
            this.stuckTarget = false;
            this.stuckWall = false;
            this.offsetX = 0;
            this.offsetY = 0;
        }

        update() {
            if (this.isFlying) {
                this.vy += GRAVITY;
                this.x += this.vx;
                this.y += this.vy;
                this.angle = Math.atan2(this.vy, this.vx);

                // --- Target Collision ---
                const dx = this.x + Math.cos(this.angle) * this.length / 2 - target.x;
                const dy = this.y + Math.sin(this.angle) * this.length / 2 - target.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < target.radius) {
                    this.isFlying = false;
                    this.stuckTarget = true;
                    this.offsetX = this.x - target.x;
                    this.offsetY = this.y - target.y;
                    
                    if (dist < target.radius * 0.25) {
                        score += 50; 
                        createStarExplosion(this.x, this.y, '#ffcc00');
                    } else if (dist < target.radius * 0.6) {
                        score += 20; 
                        createStarExplosion(this.x, this.y, '#ffffff');
                    } else {
                        score += 10; 
                        createStarExplosion(this.x, this.y, '#ff0044');
                    }
                    scoreEl.innerText = score;
                    return; // Stop checking walls if hit target
                }

                // --- Room Wall Collisions ---
                let tipX = this.x + Math.cos(this.angle) * this.length / 2;
                let tipY = this.y + Math.sin(this.angle) * this.length / 2;

                if (tipY >= height) { // Hit Floor
                    this.y -= (tipY - height);
                    this.isFlying = false;
                    this.stuckWall = true;
                } else if (tipY <= 0) { // Hit Ceiling
                    this.y -= tipY;
                    this.isFlying = false;
                    this.stuckWall = true;
                } else if (tipX >= width) { // Hit Back Wall (Right)
                    this.x -= (tipX - width);
                    this.isFlying = false;
                    this.stuckWall = true;
                } else if (tipX <= 0 && this.vx < 0) { // Hit Left Wall (If flying backwards)
                    this.x -= tipX;
                    this.isFlying = false;
                    this.stuckWall = true;
                }

            } else if (this.stuckTarget) {
                this.x = target.x + this.offsetX;
                this.y = target.y + this.offsetY;
            }
        }

        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.angle);

            // Shaft
            const shaftGrd = ctx.createLinearGradient(0, -2, 0, 2);
            shaftGrd.addColorStop(0, '#ffffff');
            shaftGrd.addColorStop(0.5, '#666666');
            shaftGrd.addColorStop(1, '#ffffff');
            
            ctx.beginPath();
            ctx.moveTo(-this.length / 2, 0);
            ctx.lineTo(this.length / 2, 0);
            ctx.strokeStyle = shaftGrd;
            ctx.lineWidth = 3;
            ctx.stroke();

            // Arrow head
            ctx.beginPath();
            ctx.moveTo(this.length / 2, 0);
            ctx.lineTo(this.length / 2 - 10, -6);
            ctx.lineTo(this.length / 2 - 10, 6);
            ctx.closePath();
            ctx.fillStyle = '#a0aec0';
            ctx.fill();

            // Feathers
            ctx.beginPath();
            ctx.moveTo(-this.length / 2, 0);
            ctx.lineTo(-this.length / 2 - 12, -6);
            ctx.lineTo(-this.length / 2 - 8, 0);
            ctx.lineTo(-this.length / 2 - 12, 6);
            ctx.closePath();
            ctx.fillStyle = '#00ffcc';
            ctx.fill();

            ctx.restore();
        }
    }

    // --- Star Particle Animation Class ---
    class StarParticle {
        constructor(x, y, color) {
            this.x = x;
            this.y = y;
            let angle = Math.random() * Math.PI * 2;
            let speed = Math.random() * 6 + 3;
            this.vx = Math.cos(angle) * speed;
            this.vy = Math.sin(angle) * speed;
            this.color = color;
            this.life = 1.0;
            this.decay = Math.random() * 0.02 + 0.015;
            this.rotation = Math.random() * Math.PI;
            this.rotSpeed = (Math.random() - 0.5) * 0.3;
            this.size = Math.random() * 5 + 3; 
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.vy += 0.2; // Gravity pull for stars
            this.rotation += this.rotSpeed;
            this.life -= this.decay;
        }

        draw() {
            if(this.life <= 0) return;
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.rotation);
            ctx.globalAlpha = Math.max(0, this.life);
            
            let spikes = 5;
            let outerRadius = this.size;
            let innerRadius = this.size / 2;
            let rot = Math.PI / 2 * 3;
            let x = 0, y = 0;
            let step = Math.PI / spikes;

            ctx.beginPath();
            ctx.moveTo(0, -outerRadius);
            for (let i = 0; i < spikes; i++) {
                x = Math.cos(rot) * outerRadius;
                y = Math.sin(rot) * outerRadius;
                ctx.lineTo(x, y);
                rot += step;
                x = Math.cos(rot) * innerRadius;
                y = Math.sin(rot) * innerRadius;
                ctx.lineTo(x, y);
                rot += step;
            }
            ctx.lineTo(0, -outerRadius);
            ctx.closePath();
            
            ctx.fillStyle = this.color;
            ctx.shadowColor = this.color;
            ctx.shadowBlur = 10;
            ctx.fill();
            
            ctx.restore();
        }
    }

    function createStarExplosion(x, y, color) {
        for (let i = 0; i < 20; i++) {
            starParticles.push(new StarParticle(x, y, color));
        }
    }

    // --- Input and Trajectory ---
    function drawTrajectory() {
        if (!isDragging || bow.pullDistance <= 10) return;

        const power = bow.pullDistance * PULL_POWER_MULTIPLIER;
        const vx = Math.cos(bow.angle) * power;
        const vy = Math.sin(bow.angle) * power;
        
        let tx = bow.x - Math.cos(bow.angle) * bow.pullDistance;
        let ty = bow.y - Math.sin(bow.angle) * bow.pullDistance;
        let tvx = vx;
        let tvy = vy;

        ctx.beginPath();
        ctx.moveTo(tx, ty);
        
        for (let i = 0; i < 30; i++) {
            tvy += GRAVITY;
            tx += tvx;
            ty += tvy;
            ctx.lineTo(tx, ty);
        }

        ctx.strokeStyle = 'rgba(0, 255, 255, 0.5)';
        ctx.lineWidth = 2;
        ctx.setLineDash([8, 12]);
        ctx.stroke();
        ctx.setLineDash([]);
    }

    function handleStart(e) {
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        isDragging = true;
        dragStartX = clientX;
        dragStartY = clientY;
        dragCurrentX = clientX;
        dragCurrentY = clientY;
    }

    function handleMove(e) {
        if (!isDragging) return;
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        dragCurrentX = clientX;
        dragCurrentY = clientY;

        const dx = dragStartX - dragCurrentX;
        const dy = dragStartY - dragCurrentY;
        
        bow.angle = Math.atan2(dy, dx);
        bow.pullDistance = Math.min(bow.maxPull, Math.sqrt(dx*dx + dy*dy));
    }

    function handleEnd() {
        if (!isDragging) return;
        isDragging = false;
        
        if (bow.pullDistance > 10) {
            const power = bow.pullDistance * PULL_POWER_MULTIPLIER;
            const vx = Math.cos(bow.angle) * power;
            const vy = Math.sin(bow.angle) * power;
            
            const startX = bow.x - Math.cos(bow.angle) * bow.pullDistance;
            const startY = bow.y - Math.sin(bow.angle) * bow.pullDistance;

            arrows.push(new Arrow(startX, startY, vx, vy));
        }
        
        bow.pullDistance = 0;
        bow.angle = 0;
    }

    // --- Initialization ---
    resize(); 
    target = new Target();
    bow = new Bow();

    canvas.addEventListener('mousedown', handleStart);
    canvas.addEventListener('mousemove', handleMove);
    window.addEventListener('mouseup', handleEnd);

    canvas.addEventListener('touchstart', handleStart, {passive: false});
    canvas.addEventListener('touchmove', handleMove, {passive: false});
    window.addEventListener('touchend', handleEnd);

    // --- Game Loop ---
    function animate() {
        ctx.clearRect(0, 0, width, height);

        // Draw Room Background
        drawRoom();

        // Manage Target
        target.update();
        target.draw();
        
        // Manage Bow
        bow.update();
        if (isDragging) drawTrajectory();

        // Loaded Arrow Placeholder
        if (isDragging && bow.pullDistance > 10) {
            ctx.save();
            const ax = bow.x - Math.cos(bow.angle) * bow.pullDistance;
            const ay = bow.y - Math.sin(bow.angle) * bow.pullDistance;
            ctx.translate(ax, ay);
            ctx.rotate(bow.angle);
            
            let arrLen = Math.max(40, Math.min(60, width * 0.1)) * 0.8;
            
            ctx.beginPath();
            ctx.moveTo(-arrLen/2, 0); ctx.lineTo(arrLen/2, 0);
            ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 3; ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(arrLen/2, 0); ctx.lineTo(arrLen/2 - 8, -4); ctx.lineTo(arrLen/2 - 8, 4);
            ctx.fillStyle = 'rgba(160, 174, 192, 0.4)'; ctx.fill();
            ctx.restore();
        }

        bow.draw();

        // Manage Arrows
        let activeArrows = [];
        let stuckArrowsCount = 0;
        
        for (let i = 0; i < arrows.length; i++) {
            arrows[i].update();
            arrows[i].draw();
            
            // Limit the number of stuck arrows to keep performance good (Max 20 stuck arrows)
            if (arrows[i].stuckWall || arrows[i].stuckTarget) {
                stuckArrowsCount++;
            }
            activeArrows.push(arrows[i]);
        }
        
        // Remove oldest stuck arrows if there are more than 20
        if (stuckArrowsCount > 20) {
            for (let i = 0; i < activeArrows.length; i++) {
                if (activeArrows[i].stuckWall || activeArrows[i].stuckTarget) {
                    activeArrows.splice(i, 1);
                    break; 
                }
            }
        }
        arrows = activeArrows;

        // Manage Star Particles
        for (let i = starParticles.length - 1; i >= 0; i--) {
            starParticles[i].update();
            starParticles[i].draw();
            if (starParticles[i].life <= 0) {
                starParticles.splice(i, 1);
            }
        }

        requestAnimationFrame(animate);
    }

    animate();
</script>
</body>
</html>
